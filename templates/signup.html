<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>WAF - Signup</title>
</head>
<body>
    <div class="container" style="max-width: 450px;">
        <h2>ShieldAI | Add Admin</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash-message flash-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="text" name="username" placeholder="New Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <input type="password" name="invite_code" placeholder="Master Admin Invite Code" required>
            <button type="submit" class="btn">Register Admin</button>
        </form>
        <div class="subtext">
            Return to <a href="/login">Login</a>
        </div>
    </div>
</body>
</html>
